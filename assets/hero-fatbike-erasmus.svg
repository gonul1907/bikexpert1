<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Fatbike bij brug - hero artwork</title>
  <desc id="desc">Custom illustratie met skyline, brug en fatbike in Rotterdam-achtige sfeer.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3145"/>
      <stop offset="45%" stop-color="#2f5d7a"/>
      <stop offset="100%" stop-color="#8aa6b8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#224761"/>
      <stop offset="100%" stop-color="#163245"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dce3e8"/>
      <stop offset="100%" stop-color="#f3f5f7"/>
    </linearGradient>
    <linearGradient id="bike" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0f12"/>
      <stop offset="100%" stop-color="#20262d"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#sky)"/>
  <circle cx="1180" cy="110" r="55" fill="#f3f8fc" opacity="0.8"/>

  <rect y="340" width="1600" height="180" fill="url(#water)"/>
  <rect y="338" width="1600" height="2" fill="#90b7cc" opacity="0.35"/>

  <g opacity="0.35" fill="#0f1f2b">
    <rect x="0" y="260" width="70" height="80"/>
    <rect x="78" y="245" width="48" height="95"/>
    <rect x="132" y="272" width="58" height="68"/>
    <rect x="195" y="228" width="75" height="112"/>
    <rect x="278" y="248" width="61" height="92"/>
    <rect x="346" y="220" width="66" height="120"/>
    <rect x="418" y="264" width="74" height="76"/>
    <rect x="500" y="236" width="64" height="104"/>
    <rect x="572" y="250" width="86" height="90"/>
  </g>

  <g>
    <polygon points="820,95 870,95 1050,338 1002,338" fill="url(#bridge)" opacity="0.95"/>
    <polygon points="869,95 904,95 1096,338 1062,338" fill="#ffffff" opacity="0.95"/>
    <rect x="920" y="310" width="680" height="16" fill="#d7dfe5"/>
    <line x1="920" y1="318" x2="1040" y2="175" stroke="#f2f6f9" stroke-width="3"/>
    <line x1="980" y1="318" x2="1082" y2="192" stroke="#f2f6f9" stroke-width="2"/>
    <line x1="1042" y1="318" x2="1125" y2="208" stroke="#f2f6f9" stroke-width="2"/>
    <line x1="1108" y1="318" x2="1168" y2="226" stroke="#f2f6f9" stroke-width="2"/>
  </g>

  <g transform="translate(920,356)">
    <ellipse cx="-210" cy="68" rx="215" ry="22" fill="#06131c" opacity="0.45" filter="url(#softGlow)"/>

    <circle cx="-270" cy="55" r="62" fill="none" stroke="#12181d" stroke-width="20"/>
    <circle cx="-70" cy="55" r="62" fill="none" stroke="#12181d" stroke-width="20"/>
    <circle cx="-270" cy="55" r="34" fill="none" stroke="#8a9aa6" stroke-width="6" opacity="0.75"/>
    <circle cx="-70" cy="55" r="34" fill="none" stroke="#8a9aa6" stroke-width="6" opacity="0.75"/>

    <path d="M-270 55 L-185 -5 L-120 55 L-215 55 Z" fill="none" stroke="url(#bike)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-185 -5 L-126 -5 L-70 55" fill="none" stroke="url(#bike)" stroke-width="12" stroke-linecap="round"/>
    <line x1="-214" y1="-18" x2="-185" y2="-5" stroke="url(#bike)" stroke-width="10" stroke-linecap="round"/>
    <line x1="-127" y1="-5" x2="-92" y2="-38" stroke="url(#bike)" stroke-width="10" stroke-linecap="round"/>
    <line x1="-245" y1="40" x2="-286" y2="33" stroke="#1d2329" stroke-width="9" stroke-linecap="round"/>
    <line x1="-139" y1="10" x2="-168" y2="20" stroke="#1d2329" stroke-width="9" stroke-linecap="round"/>

    <rect x="-221" y="-25" width="34" height="9" rx="4" fill="#1a2026"/>
    <rect x="-108" y="-44" width="31" height="7" rx="3" fill="#1a2026"/>
  </g>

  <rect width="1600" height="520" fill="#000" opacity="0.2"/>
</svg>
